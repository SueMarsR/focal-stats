<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>焦段统计 · Focal Stats</title>
    <style>
      :root {
        --bg1: #f5f5f7; --bg2: #ffffff;
        --text: #1d1d1f; --muted: #6e6e73;
        --accent: #0071e3; --accent-bright: #0a84ff;
        --accent-grad: linear-gradient(135deg, #0071e3, #5e5ce6);
        --title-grad: linear-gradient(135deg, #1d1d1f, #0071e3);
        --card-bg: rgba(255, 255, 255, 0.6);
        --card-border: rgba(0, 0, 0, 0.08);
        --field-bg: rgba(255, 255, 255, 0.75);
        --track: rgba(0, 0, 0, 0.07);
        --shadow: 0 10px 34px rgba(0, 0, 0, 0.1);
        --focus-ring: 0 0 0 4px rgba(0, 113, 227, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg1: #000000; --bg2: #1c1c1e;
          --text: #f5f5f7; --muted: #98989d;
          --accent: #0a84ff; --accent-bright: #64d2ff;
          --accent-grad: linear-gradient(135deg, #0a84ff, #64d2ff);
          --title-grad: linear-gradient(135deg, #f5f5f7, #64d2ff);
          --card-bg: rgba(44, 44, 46, 0.55);
          --card-border: rgba(255, 255, 255, 0.12);
          --field-bg: rgba(255, 255, 255, 0.07);
          --track: rgba(255, 255, 255, 0.11);
          --shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
          --focus-ring: 0 0 0 4px rgba(10, 132, 255, 0.3);
        }
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: linear-gradient(165deg, var(--bg1), var(--bg2));
        background-attachment: fixed; min-height: 100vh;
        max-width: 820px; margin: 0 auto; padding: 3rem 1.25rem 4rem;
        line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
      }
      header { margin-bottom: 2rem; }
      h1 {
        font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 0.55rem;
        display: flex; align-items: baseline; gap: 0.6rem;
        background: var(--title-grad); -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
      h1 .en { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; -webkit-text-fill-color: var(--muted); color: var(--muted); }
      header .rule { height: 3px; width: 44px; background: var(--accent); border-radius: 3px; }
      header p, .url-hint, .share-hint, .demo-line { color: var(--muted); font-size: 0.9rem; }

      .dropzone, .hero, .panel, .card, #share-row, .url-input {
        background: var(--card-bg);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid var(--card-border); border-radius: 18px;
      }
      @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
        .dropzone, .hero, .panel, .card, #share-row, .url-input { background: var(--bg2); }
      }

      .pickers { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1.5rem 0; }
      .dropzone {
        flex: 1 1 240px; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
        text-align: center; cursor: pointer; padding: 1.75rem 1rem; font: inherit; color: inherit; width: 100%;
        transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      }
      .dropzone:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
      .dropzone:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .dropzone .icon { font-size: 1.7rem; }
      .dropzone .main { font-size: 1rem; font-weight: 600; }
      .dropzone .sub { font-size: 0.8rem; color: var(--muted); }

      .url-input { padding: 1rem 1.25rem; margin: 1.25rem 0; }
      .url-label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
      #urls { width: 100%; background: var(--field-bg); color: var(--text); border: 1px solid var(--card-border); border-radius: 12px; padding: 0.6rem 0.75rem; font: inherit; resize: vertical; }
      #urls:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }

      #parse-urls, #share-card, .demo-btn {
        font: inherit; font-weight: 600; cursor: pointer; border-radius: 12px; padding: 0.55rem 1.1rem;
        transition: filter 0.15s, transform 0.1s, box-shadow 0.15s; border: 1px solid transparent;
      }
      #parse-urls { background: var(--accent); color: #fff; border-color: transparent; margin-top: 0.6rem; }
      .demo-btn, #share-card { background: var(--field-bg); color: var(--accent); border-color: var(--card-border); }
      #parse-urls:hover, .demo-btn:hover, #share-card:hover { filter: brightness(1.06); }
      #parse-urls:active, .demo-btn:active, #share-card:active { transform: scale(0.98); }
      #parse-urls:focus-visible, .demo-btn:focus-visible, #share-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .demo-line { margin: 1rem 0 0.25rem; }

      .hero { padding: 1.75rem; margin: 1.25rem 0; }
      .hero-num {
        font-size: 3.5rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em;
        background: var(--accent-grad); -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent; display: inline-block;
      }
      @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
        .hero-num { color: var(--accent); -webkit-text-fill-color: currentColor; }
      }
      .hero-num .hero-unit { font-size: 1.3rem; font-weight: 500; -webkit-text-fill-color: var(--muted); color: var(--muted); }
      .hero-label { color: var(--muted); font-size: 0.95rem; margin-top: 0.6rem; }

      .status { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; margin: 1.25rem 0; }

      .chart { margin: 0.5rem 0 1.5rem; }
      #chart text { font-family: inherit; }
      #chart .lbl { fill: var(--text); }
      #chart .val { fill: var(--muted); }
      #chart .track { fill: var(--track); }
      #chart .bar { fill: var(--accent); transform-box: fill-box; transform-origin: left center; animation: grow 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      #chart .bar[data-top] { fill: var(--accent-bright); }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { #chart .bar { animation: none; } }

      #insights .panel-title { margin: 1.75rem 0 0.75rem; }
      .panel-title { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 1rem; }
      .card { padding: 0.85rem 1.1rem; margin: 0.6rem 0; font-size: 0.95rem; color: var(--text); border-left: 3px solid var(--accent); }

      #share-row { padding: 1rem 1.25rem; margin: 1.25rem 0; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

      .panel { padding: 1.25rem 1.5rem; margin: 1.5rem 0; }
      .fields { display: flex; flex-wrap: wrap; gap: 1rem 1.25rem; }
      label { display: inline-flex; flex-direction: column; gap: 0.35rem; font-size: 0.8rem; color: var(--muted); }
      select, input[type="text"], input[type="number"] {
        background: var(--field-bg); color: var(--text); border: 1px solid var(--card-border);
        border-radius: 10px; padding: 0.45rem 0.6rem; font: inherit; font-size: 0.9rem; min-width: 7rem;
      }
      input[type="text"] { min-width: 11rem; }
      select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }

      footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.8rem; }
      footer a { color: var(--accent); text-decoration: none; }
      footer a:hover { text-decoration: underline; }

      .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>焦段统计 <span class="en">FOCAL STATS</span></h1>
      <div class="rule"></div>
      <p>选择 SD 卡 / 照片文件夹，统计你最常用的焦段。照片<strong>不会上传</strong>，全程浏览器本地解析 EXIF。</p>
    </header>

    <div class="pickers">
      <button type="button" class="dropzone" id="btn-folder" aria-label="选择文件夹">
        <span class="icon" aria-hidden="true">📂</span>
        <span class="main">选择文件夹</span>
        <span class="sub">电脑 / SD 卡 · 递归扫描整个文件夹（含 RAW）</span>
      </button>
      <button type="button" class="dropzone" id="btn-photos" aria-label="从相册选择照片">
        <span class="icon" aria-hidden="true">🖼️</span>
        <span class="main">从相册 / 选照片</span>
        <span class="sub">手机点此进相册多选 · 截图自动跳过</span>
      </button>
      <input id="picker-folder" class="visually-hidden" type="file" webkitdirectory multiple tabindex="-1" aria-hidden="true" />
      <input id="picker-photos" class="visually-hidden" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true" />
    </div>

    <div class="url-input">
      <label class="url-label" for="urls">或粘贴照片直链（每行一个）</label>
      <textarea id="urls" rows="3" placeholder="https://example.com/DSCF1234.jpg" aria-label="照片直链，每行一个"></textarea>
      <button id="parse-urls" type="button">解析链接</button>
      <p class="url-hint">直链需允许跨域（CORS）；百度网盘 / iCloud 等分享链接通常无法直接读取。</p>
    </div>

    <p class="demo-line">没有照片？<button id="demo" type="button" class="demo-btn">用示例数据看看 →</button></p>

    <div id="hero" class="hero" style="display:none"></div>

    <p id="status" class="status"></p>
    <div id="chart" class="chart"></div>
    <div id="insights"></div>

    <div id="share-row" style="display:none">
      <button id="share-card" type="button">📸 生成分享卡片 · Share card</button>
      <p class="share-hint">导出一张「镜头画像」长图，分享到小红书 / Instagram。卡片只含机身/镜头型号，不含原图。</p>
    </div>

    <section class="panel">
      <h2 class="panel-title">设置 · Settings</h2>
      <div class="fields">
        <label>模式
          <select id="mode"><option value="equiv35">35mm 等效</option><option value="raw">原始焦距</option></select>
        </label>
        <label>分桶边界 <input id="buckets" type="text" value="16,24,35,50,70,100,200" /></label>
        <label>镜头筛选 <input id="lens" type="text" placeholder="如 24-70" /></label>
        <label>机身筛选 <input id="camera" type="text" placeholder="如 A7" /></label>
        <label>定焦阈值 <input id="threshold" type="number" min="0" max="1" step="0.05" value="0.6" /></label>
        <label>Top-N <input id="topn" type="number" min="1" value="3" /></label>
      </div>
    </section>

    <footer>
      开源于 <a href="https://github.com/SueMarsR/focal-stats" target="_blank" rel="noopener">GitHub</a> · 源代码以 AGPL-3.0 授权 · 照片不上传，本地解析
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
