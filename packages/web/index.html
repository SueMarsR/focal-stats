<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>焦段统计 · Focal Stats</title>
    <style>
      :root {
        --bg: #16181c; --panel: #1f2228; --panel-hover: #21252c; --border: #2c3036;
        --text: #e7e7ea; --muted: #8a8d93; --amber: #e0a64d;
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg); color: var(--text);
        max-width: 860px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem;
        line-height: 1.55; font-variant-numeric: tabular-nums;
      }
      header { margin-bottom: 1.75rem; }
      h1 {
        font-size: 1.4rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
        margin: 0 0 .5rem; display: flex; align-items: baseline; gap: .6rem;
      }
      h1 .en { font-size: .7rem; letter-spacing: .2em; color: var(--muted); font-weight: 500; }
      header .rule { height: 2px; width: 56px; background: var(--amber); border-radius: 2px; }
      header p { color: var(--muted); font-size: .9rem; margin: .75rem 0 0; }

      .dropzone {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: .5rem; text-align: center; cursor: pointer;
        border: 1.5px dashed var(--border); border-radius: 12px;
        background: var(--panel); padding: 2rem 1rem; margin: 1.5rem 0;
        transition: border-color .2s, background .2s;
      }
      .dropzone:hover { border-color: var(--amber); background: var(--panel-hover); }
      .dropzone:focus-within { border-color: var(--amber); outline: 2px solid var(--amber); outline-offset: 2px; }
      .dropzone .icon { font-size: 1.6rem; color: var(--amber); }
      .dropzone .main { font-size: 1rem; color: var(--text); }
      .dropzone .sub { font-size: .8rem; color: var(--muted); }
      .visually-hidden {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      .hero {
        background: linear-gradient(180deg, #20242b, #1b1e23);
        border: 1px solid var(--border); border-radius: 12px;
        padding: 1.5rem 1.75rem; margin: 1.25rem 0;
      }
      .hero-num { font-size: 3rem; font-weight: 600; line-height: 1; color: var(--amber); }
      .hero-num .hero-unit { font-size: 1.2rem; color: var(--muted); margin-left: .15rem; }
      .hero-label { color: var(--muted); font-size: .9rem; margin-top: .5rem; letter-spacing: .02em; }

      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.25rem; margin: 1.25rem 0; }
      .panel-title { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 .9rem; font-weight: 600; }
      .fields { display: flex; flex-wrap: wrap; gap: .85rem 1.25rem; }
      label { display: inline-flex; flex-direction: column; gap: .3rem; font-size: .8rem; color: var(--muted); }
      select, input[type="text"], input[type="number"] {
        background: #15171b; color: var(--text); border: 1px solid var(--border);
        border-radius: 7px; padding: .4rem .55rem; font: inherit; font-size: .9rem;
        transition: border-color .15s, box-shadow .15s; min-width: 7rem;
      }
      input[type="text"] { min-width: 11rem; }
      select:focus, input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(224,166,77,.18); }

      .status { color: var(--muted); font-size: .85rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 1.2em; margin: 1rem 0; }

      .chart { margin: .5rem 0 1.5rem; }
      #chart .bar { transform-box: fill-box; transform-origin: left center; animation: grow .45s ease-out both; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { #chart .bar { animation: none; } }

      #insights .panel-title { margin: 1.5rem 0 .75rem; }
      .card {
        background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--amber);
        border-radius: 8px; padding: .7rem 1rem; margin: .55rem 0; font-size: .92rem; color: var(--text);
      }

      footer { margin-top: 2.5rem; color: var(--muted); font-size: .8rem; }
      footer a { color: var(--amber); text-decoration: none; }
      footer a:hover { text-decoration: underline; }

      .url-input { margin: 0 0 1.5rem; }
      .url-label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .4rem; }
      #urls {
        width: 100%; background: var(--panel); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px; padding: .6rem .7rem;
        font-family: inherit; font-size: .85rem; resize: vertical;
      }
      #urls:focus { outline: none; border-color: var(--amber); }
      #parse-urls {
        margin-top: .5rem; background: var(--amber); color: var(--bg); border: none;
        border-radius: 8px; padding: .5rem 1rem; font-weight: 600; cursor: pointer;
      }
      #parse-urls:hover { background: var(--amber-hi, #f0b95e); }
      .url-hint { font-size: .75rem; color: var(--muted); margin: .5rem 0 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>焦段统计 <span class="en">FOCAL STATS</span></h1>
      <div class="rule"></div>
      <p>选择 SD 卡 / 照片文件夹，统计你最常用的焦段。照片<strong>不会上传</strong>，全程浏览器本地解析 EXIF。</p>
    </header>

    <label class="dropzone" for="picker">
      <span class="icon" aria-hidden="true">📂</span>
      <span class="main">点击选择文件夹</span>
      <span class="sub">支持 JPEG 与 RAW（CR2/NEF/ARW/DNG…）· 只读文件头，不上传</span>
      <input id="picker" class="visually-hidden" type="file" webkitdirectory multiple aria-label="选择 SD 卡文件夹" />
    </label>

    <div class="url-input">
      <label class="url-label" for="urls">或粘贴照片直链（每行一个）</label>
      <textarea id="urls" rows="3" placeholder="https://example.com/DSCF1234.jpg" aria-label="照片直链，每行一个"></textarea>
      <button id="parse-urls" type="button">解析链接</button>
      <p class="url-hint">直链需允许跨域（CORS）；百度网盘 / iCloud 等分享链接通常无法直接读取。</p>
    </div>

    <div id="hero" class="hero" style="display:none"></div>

    <p id="status" class="status"></p>
    <div id="chart" class="chart"></div>
    <div id="insights"></div>

    <section class="panel">
      <h2 class="panel-title">设置 · Settings</h2>
      <div class="fields">
        <label>模式
          <select id="mode"><option value="equiv35">35mm 等效</option><option value="raw">原始焦距</option></select>
        </label>
        <label>分桶边界 <input id="buckets" type="text" value="16,24,35,50,70,100,200" /></label>
        <label>镜头筛选 <input id="lens" type="text" placeholder="如 24-70" /></label>
        <label>机身筛选 <input id="camera" type="text" placeholder="如 A7" /></label>
        <label>定焦阈值 <input id="threshold" type="number" min="0" max="1" step="0.05" value="0.6" /></label>
        <label>Top-N <input id="topn" type="number" min="1" value="3" /></label>
      </div>
    </section>

    <footer>
      开源于 <a href="https://github.com/SueMarsR/focal-stats" target="_blank" rel="noopener">GitHub</a> · 源代码以 AGPL-3.0 授权 · 照片不上传，本地解析
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
